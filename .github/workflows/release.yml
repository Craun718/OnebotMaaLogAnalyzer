name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version info
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # 预发布判定
          if [[ "$VERSION" =~ alpha|beta|rc|dev|preview ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ steps.meta.outputs.prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compose final release body
        run: |
          {
            if [ -s CHANGES.md ]; then
              cat CHANGES.md
            else
              # FALLBACK: git-cliff 失败时回退到 git log
              PREV_TAG=$(git tag --sort=-v:refname | sed -n "/^${{ github.ref_name }}$/{n;p}")
              echo "## ${{ steps.meta.outputs.version }} ($(date +%Y-%m-%d))"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                git log "${PREV_TAG}..HEAD" --format="- %s" --no-merges
              else
                git log --format="- %s" --no-merges
              fi
            fi
          } > /tmp/release_body.md

          echo "Final release body:"
          cat /tmp/release_body.md

      - name: Create release archives
        run: bash .github/scripts/package.sh "$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: V${{ steps.meta.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            OnebotMaaLogAnalyzer-${{ steps.meta.outputs.version }}.zip
            OnebotMaaLogAnalyzer-${{ steps.meta.outputs.version }}-light.zip
            OnebotMaaLogAnalyzer-${{ steps.meta.outputs.version }}-astrbot.zip
          prerelease: ${{ steps.meta.outputs.prerelease }}
