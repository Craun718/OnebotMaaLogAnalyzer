name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout comparison revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.ref_name == github.event.repository.default_branch && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
          path: .ci-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install mypy
        run: python -m pip install mypy==2.4.1
      - name: Check types against baseline
        run: python .github/scripts/check_types.py

  packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archives
        env:
          VERSION: ci-${{ github.sha }}
        run: bash .github/scripts/package.sh "$VERSION"
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: OnebotMaaLogAnalyzer-*.zip
          if-no-files-found: error
